<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Billing App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/general.css">
    <link rel="stylesheet" href="../static/css/home.css">
    <script>
        // In production the app will be served by the backend, so default
        // the API base to the current origin. This avoids hardcoding a
        // development-only URL.
        window.BILLING_APP_CONFIG = {
            apiBaseUrl: window.location ? window.location.origin : "http://127.0.0.1:8765"
        };
    </script>
</head>
<body class="billing-app">
    <header class="app-header">
        <div class="app-brand">
            <h1>Billing App</h1>
        </div>
        <nav class="app-nav" aria-label="Primary">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="invoice.html">Invoice</a>
            <a class="nav-link" href="receipt.html">Receipt</a>
            <a class="nav-link" href="waybill.html">Waybill</a>
        </nav>
    </header>

    <main class="app-main">
        <div class="home-container">
            <header class="home-header">
                <h2>Documents</h2>
                <div class="home-actions">
                    <button class="button" onclick="window.location.href='invoice.html'">New Invoice</button>
                    <button class="button" onclick="window.location.href='receipt.html'">New Receipt</button>
                    <button class="button" onclick="window.location.href='waybill.html'">New Waybill</button>
                </div>
            </header>

            <section class="recent-tables-grid">
                <div class="recent-table-card" id="recent-documents">
                    <div class="card-head">
                        <h3>Recent</h3>
                        <p class="card-sub">Latest created documents</p>
                    </div>
                    <div class="card-body">
                        <table class="recent-table" id="recent-table">
                            <thead>
                                <tr>
                                    <th>Type</th>
                                    <th>Number</th>
                                    <th>Date</th>
                                    <th>Customer</th>
                                    <th>Total</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="empty-row"><td colspan="6">No recent documents.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="recent-table-card" id="draft-documents">
                    <div class="card-head">
                        <h3>Drafts</h3>
                        <p class="card-sub">Saved drafts awaiting completion</p>
                    </div>
                    <div class="card-body">
                        <table class="recent-table" id="draft-table">
                            <thead>
                                <tr>
                                    <th>Type</th>
                                    <th>Number</th>
                                    <th>Date</th>
                                    <th>Customer</th>
                                    <th>Total</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="empty-row"><td colspan="6">No drafts available.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="app-footer">
        <p>&copy; <span id="current-year"></span> Billing App. All rights reserved.</p>
    </footer>

    <script src="../static/js/main.js" defer></script>
    <script src="../static/js/home.js" defer></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("current-year").textContent = new Date().getFullYear();
        });
    </script>
</body>
</html>
