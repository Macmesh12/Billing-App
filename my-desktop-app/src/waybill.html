<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waybill | Billing App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/general.css">
    <link rel="stylesheet" href="../static/css/waybill.css">
    <script>
        window.BILLING_APP_CONFIG = { apiBaseUrl: (window.location && window.location.protocol === 'http:' && window.location.port === '8765') ? window.location.origin : "http://127.0.0.1:8765" };
    </script>
</head>
<body class="billing-app">
<header class="app-header">
    <div class="app-brand"><h1>Billing App</h1></div>
    <nav class="app-nav" aria-label="Primary">
    <a class="nav-link" href="index.html">Recents</a>
        <a class="nav-link" href="invoice.html">Invoice</a>
        <a class="nav-link" href="receipt.html">Receipt</a>
        <a class="nav-link active" href="waybill.html">Waybill</a>
    </nav>
</header>

<main class="app-main">
    <section id="waybill-module" class="module" data-document-type="waybill">
        <div class="module-header module-header--long">
            <h2>Waybill</h2>
            <div class="module-actions">
                <button id="waybill-save" class="button button-secondary" type="button" title="Save PDF">Save PDF</button>
            </div>
        </div>

        <div class="module-body">
            <div class="a4-workspace">
            <form id="waybill-form" class="document waybill-document document-editable" novalidate>
                <div class="waybill-letterhead">
                    <div class="letterhead-left">
                        <h3 class="title">WAYBILL</h3>
                        <p>Waybill No.: <span id="waybill-number">—</span></p>
                        <p class="waybill-date">Date: <input type="date" id="waybill-issue-date" name="issue_date" required style="display: inline; width: auto; border: none; background: transparent;"></p>
                    </div>
                    <div class="letterhead-right">
                        <img src="/assets/logo.png" alt="logo-placeholder" class="logo-placeholder">
                    </div>
                </div>

                <input type="hidden" id="waybill-items-payload" name="items_payload" value="[]">

                <table class="document-items" id="waybill-items-table">
                    <thead>
                        <tr>
                            <th class="description">Description</th>
                            <th>Qty</th>
                            <th>Unit Price (GHC)</th>
                            <th>Amount (GHC)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <button type="button" id="waybill-add-item" class="button button-secondary">Add Item</button>

                <div class="waybill-signature-grid">
                    <div class="signature-card">
                        <span class="signature-title">Delivered By</span>
                        <label class="field-block">
                            <span>Name</span>
                            <input type="text" id="waybill-driver" name="driver_name" placeholder="Dispatch officer" required>
                        </label>
                        <label class="field-block">
                            <span>Date</span>
                            <input type="text" id="waybill-delivery-date" placeholder="Same as delivery date" aria-label="Delivery signature date">
                        </label>
                        <div class="signature-line">Signature</div>
                    </div>
                    <div class="signature-card">
                        <span class="signature-title">Received By</span>
                        <label class="field-block">
                            <span>Name</span>
                            <input type="text" id="waybill-receiver" name="receiver_name" placeholder="Receiving officer" required>
                        </label>
                        <label class="field-block">
                            <span>Date</span>
                            <input type="text" id="waybill-received-date" placeholder="Date of receipt" aria-label="Receipt signature date">
                        </label>
                        <div class="signature-line">Signature</div>
                    </div>
                </div>

                <section class="waybill-contact-bar">
                    <input type="text" id="waybill-contact" placeholder="DELIVERED BY SPAQUELS &bull; CONTACT: 0540 673202 | 050 532 1475 | 030 273 8719" aria-label="Waybill contact information">
                </section>
            </form>

            <!-- Preview removed: PDF/export clones the editable form directly -->
            </div>
        </div>
        <div class="module-toast" id="waybill-toast" role="status" aria-live="polite" hidden></div>
    </section>
</main>

<script src="../static/js/main.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" referrerpolicy="no-referrer"></script>
<script src="../static/js/waybill.js" defer></script>
</body>
</html>
