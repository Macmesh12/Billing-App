name: Build Flutter Frontend Only

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g., v1.0.0)'
        required: false
        default: 'dev'

env:
  FLUTTER_VERSION: '3.41.0'

jobs:
  build-flutter-exe:
    name: Build Flutter Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'beta'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        working-directory: billdoc
        run: flutter pub get

      - name: Analyze code
        working-directory: billdoc
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build Windows release
        working-directory: billdoc
        run: flutter build windows --release

      - name: Verify executable exists
        run: |
          if (Test-Path "billdoc/build/windows/x64/runner/Release/billdoc.exe") {
            Write-Host "billdoc.exe created successfully"
          } else {
            Write-Error "billdoc.exe not found"
            exit 1
          }

      - name: Create ZIP archive
        run: |
          $version = "${{ github.event.inputs.version || 'dev' }}"
          Compress-Archive -Path billdoc/build/windows/x64/runner/Release/* -DestinationPath "BillingApp-Frontend-$version-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: billdoc-frontend-windows
          path: BillingApp-Frontend-*-windows.zip
          retention-days: 30
