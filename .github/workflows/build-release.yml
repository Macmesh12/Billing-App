name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'dev'

env:
  FLUTTER_VERSION: '3.41.0'
  PYTHON_VERSION: '3.11'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build Django Backend EXE (PyInstaller)
  # ─────────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend (Windows)
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        working-directory: backend
        run: |
          pyinstaller --noconfirm --clean --log-level=WARN --onedir --name billing-backend runner.py

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-backend-windows
          path: backend/dist/billing-backend/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Flutter Desktop App (Windows)
  # ─────────────────────────────────────────────────────────────────────────────
  build-flutter:
    name: Build Flutter App (Windows)
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'beta'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        working-directory: billdoc
        run: flutter pub get

      - name: Build Windows release
        working-directory: billdoc
        run: flutter build windows --release

      - name: Upload Flutter artifact
        uses: actions/upload-artifact@v4
        with:
          name: billdoc-windows
          path: billdoc/build/windows/x64/runner/Release/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Package Both Apps Together
  # ─────────────────────────────────────────────────────────────────────────────
  package:
    name: Package Release
    runs-on: windows-latest
    needs: [build-backend, build-flutter]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: billing-backend-windows
          path: release/backend/

      - name: Download Flutter artifact
        uses: actions/download-artifact@v4
        with:
          name: billdoc-windows
          path: release/billdoc/

      - name: Create release package
        run: |
          # Create version file
          $version = "${{ github.event.inputs.version || github.ref_name || 'dev' }}"
          $version | Out-File -FilePath release/VERSION.txt
          
          # Create a simple launcher script
          @"
          @echo off
          echo Starting Billing App...
          start "" "%~dp0backend\billing-backend.exe" --runserver 127.0.0.1:8765
          timeout /t 3 /nobreak > nul
          start "" "%~dp0billdoc\billdoc.exe"
          "@ | Out-File -FilePath release/START_APP.bat -Encoding ASCII

      - name: Create ZIP archive
        run: |
          $version = "${{ github.event.inputs.version || github.ref_name || 'dev' }}"
          Compress-Archive -Path release/* -DestinationPath "BillingApp-$version-windows.zip"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: BillingApp-windows-package
          path: BillingApp-*-windows.zip
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Create GitHub Release (only on tags)
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: BillingApp-windows-package
          path: ./

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: BillingApp-*-windows.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
